name: Tests

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: flake8 . --count --max-line-length=120 --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-progress
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with progress bar
        run: |
          pytest tests/ -v \
            --progress \
            --cov=. \
            --cov-report=term \
            --tb=short \
            --maxfail=5
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python${{ matrix.python-version }}
          path: |
            .coverage
            pytest.xml

      - name: Tests passed
        if: success()
        run: echo "All 10 tests passed on Python ${{ matrix.python-version }}"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install black
        run: pip install black

      - name: Check formatting
        run: black --check --line-length 120 .

  security-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit

      - name: Security scan
        run: bandit -r . -f custom

  ci-success:
    runs-on: ubuntu-latest
    needs: [ lint, test, format, security-check ]
    if: always()
    steps:
      - name: Verify all checks
        run: |
          echo "lint:            ${{ needs.lint.result }}"
          echo "test:            ${{ needs.test.result }}"
          echo "format:          ${{ needs.format.result }}"
          echo "security-check:  ${{ needs.security-check.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.format.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ] && \
             [ "${{ needs.security-check.result }}" != "success" ]; then
            echo "Security check failed on main"
            exit 1
          fi

          echo "All checks passed"
